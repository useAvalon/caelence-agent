name: Canary Release

# Publishes an incrementing canary on every push to main that touches the
# library source. The release train is anchored to the next patch of the
# current stable version: stable 0.1.0 -> train v0.1.1, published as
# v0.1.1-canary.0, v0.1.1-canary.1, ... under the npm "canary" dist-tag.
#
# Auth is npm trusted publishing (OIDC), not an NPM_TOKEN secret. On npmjs.com
# add a GitHub Actions trusted publisher for this repo and workflow filename
# `canary.yml`. Until the package exists on the registry, this workflow is a
# no-op so main stays green.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bin/**"
      - "skills/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  guard:
    name: Check package on npm
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          NAME="@useavalon/caelence-agent"
          if npm view "$NAME" name >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME is not on npm yet. Add a trusted publisher on npmjs.com after the first publish, then canary will run."
          fi

  canary:
    name: Publish Canary
    needs: guard
    if: ${{ needs.guard.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install -g npm@latest
      - run: bun install
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:exports

      - name: Compute canary version
        id: ver
        run: |
          git fetch --tags --force --quiet
          NAME=$(node -e "console.log(require('./package.json').name)")
          BASE=$(node -e "console.log(require('./package.json').version.split('-')[0])")
          # Train = next patch of the current stable base version.
          TRAIN=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number);console.log(\`\${a}.\${b}.\${c+1}\`)" "$BASE")

          # Next counter must exceed any published -canary.N for this train and
          # any existing git tag (robust to partial failures).
          TAG_N=$(git tag --list "v${TRAIN}-canary.*" | sed -E 's/.*-canary\.//' | sort -n | tail -1)
          [ -z "$TAG_N" ] && TAG_N=-1
          PUB_N=$(npm view "$NAME" versions --json 2>/dev/null | node -e "
            const base='${TRAIN}';let s='';
            process.stdin.on('data',d=>s+=d).on('end',()=>{
              let v;try{v=JSON.parse(s)}catch{v=[]}
              if(!Array.isArray(v))v=v?[v]:[];
              const re=new RegExp('^'+base.replace(/\./g,'\\\\.')+'-canary\\\\.(\\\\d+)\$');
              const ns=v.map(x=>{const m=re.exec(x);return m?+m[1]:-1}).filter(n=>n>=0);
              console.log(ns.length?Math.max(...ns):-1);
            });
          ")
          MAX=$TAG_N
          [ "$PUB_N" -gt "$MAX" ] && MAX=$PUB_N
          N=$((MAX + 1))
          VERSION="${TRAIN}-canary.${N}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Canary version: ${VERSION}"

      - name: Publish canary
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NAME=$(node -e "console.log(require('./package.json').name)")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skip: ${NAME}@${VERSION} already published"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version >/dev/null
          npm publish --tag canary --access public

      - name: Tag and GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # Tag the released commit; don't commit the canary bump back to main.
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes --prerelease
