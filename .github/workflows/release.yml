name: Release

# Manual workflow for publishing beta, rc, and stable releases.
# Auto-detects the semver bump from conventional commit messages since the last
# release tag; use bump-override to force a specific bump.
#
# Auth is npm trusted publishing (OIDC), not an NPM_TOKEN secret. On npmjs.com
# add a GitHub Actions trusted publisher for this repo and workflow filename
# `release.yml`. npm CLI 11.5.1+ exchanges the Actions id-token at publish time.

on:
  workflow_dispatch:
    inputs:
      bump-override:
        description: "Version bump (auto = detect from commits)"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - stable
          - beta
          - rc
      dry-run:
        description: "Dry run (no publish/tag)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release (${{ inputs.channel }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm install -g npm@latest
      - run: bun install
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:exports

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect semver bump
        id: detect
        run: |
          OVERRIDE="${{ inputs.bump-override }}"
          if [ "$OVERRIDE" != "auto" ]; then
            echo "bump=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "::notice::Bump: $OVERRIDE (manual override)"
            exit 0
          fi
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            RANGE=""
            echo "::notice::No previous tag; scanning all commits."
          else
            RANGE="${LAST_TAG}..HEAD"
            echo "::notice::Last tag: $LAST_TAG"
          fi
          SUBJECTS=$(git log $RANGE --format='%s')
          BODIES=$(git log $RANGE --format='%B')
          BUMP="patch"
          if echo "$BODIES" | grep -qiE '^BREAKING[ -]CHANGE:' \
            || echo "$SUBJECTS" | grep -qE '^(feat|fix|chore|refactor|perf|build|ci|docs|style|test|revert)(\(.*\))?!:'; then
            BUMP="major"
          elif echo "$SUBJECTS" | grep -qE '^feat(\(.*\))?:'; then
            BUMP="minor"
          fi
          if [ -z "$LAST_TAG" ] && [ "$BUMP" = "patch" ]; then
            BUMP="minor"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "::notice::Detected bump: $BUMP"

      - name: Bump version
        id: version
        run: |
          BUMP="${{ steps.detect.outputs.bump }}"
          CHANNEL="${{ inputs.channel }}"
          if [ "$CHANNEL" = "stable" ]; then
            NEW=$(npm version "$BUMP" --no-git-tag-version)
          else
            NEW=$(npm version "pre${BUMP}" --preid="$CHANNEL" --no-git-tag-version)
          fi
          echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::New version: ${NEW}"

      - name: Publish to npm
        run: |
          TAG="${{ inputs.channel }}"
          [ "$TAG" = "stable" ] && TAG="latest"
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "[DRY RUN] npm publish --tag $TAG"
            npm publish --dry-run --tag "$TAG"
          else
            npm publish --tag "$TAG" --access public
          fi

      - name: Tag, GitHub Release, and version PR
        if: ${{ inputs.dry-run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          BRANCH="release/v${VERSION}"
          git checkout -b "$BRANCH"
          git add package.json bun.lock 2>/dev/null || git add package.json
          git commit -m "release: v${VERSION}"
          git push -u origin "$BRANCH"
          git tag "$TAG"
          git push origin "$TAG"
          gh pr create --base main --head "$BRANCH" --title "release: v${VERSION}" --body "Version bump from the release workflow. npm already published this version."
          PRERELEASE=""
          [ "${{ inputs.channel }}" != "stable" ] && PRERELEASE="--prerelease"
          gh release create "$TAG" --title "v${VERSION}" --generate-notes $PRERELEASE
