# Pending changesets on main -> "release: version packages" PR. Merging that PR -> publish, tag, GitHub Release.
# Lint, typecheck, and tests run in ci.yml on every PR (including the version PR) before it merges.
#
# Auth is npm trusted publishing (OIDC), not an NPM_TOKEN secret. On npmjs.com add a GitHub Actions
# trusted publisher for this repo and workflow filename `release.yml`. npm CLI 11.5.1+ exchanges the
# Actions id-token at publish time.
#
# Repo setting needed: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve
# pull requests". See .changeset/README.md.
name: Release
on:
  push:
    branches: [main]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    if: github.repository_owner == 'useAvalon'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g npm@latest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          # @changesets/changelog-github reads this to link PRs and authors in the changelog.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version-script: bun run version
          publish-script: bun run release
          commit-message: "release: version packages"
          pr-title: "release: version packages"
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
